<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SnapQR Dashboard</title>
<style>
body {
  font-family: system-ui;
  background: #f5f7fa;
  margin: 0;
  padding: 40px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,.08);
}

input, button {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 15px;
}

button {
  background: #111;
  color: white;
  cursor: pointer;
  border: none;
}

.stats {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.stat {
  flex: 1;
  background: #f0f2f6;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <h1>📊 SnapQR Dashboard</h1>

  <div class="card">
    <input id="slug" placeholder="Código QR (slug)">
    <button onclick="verStats()">Ver estadísticas</button>
  </div>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat">
      <h2 id="scans">0</h2>
      <p>Escaneos</p>
    </div>
  </div>

</div>

<script>
async function verStats() {
  const slug = document.getElementById("slug").value;

  const res = await fetch(
    `https://snapqr-api.enzovillarroelv.workers.dev/api/stats/${slug}`
  );

  const data = await res.json();

  document.getElementById("scans").textContent = data.scans;
  document.getElementById("stats").style.display = "flex";
}
</script>
<script>
if (!localStorage.getItem("snapqr_token")) {
  window.location.href = "/login.html";
}
</script>

</body>
</html>
