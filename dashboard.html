<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SnapQR · Login</title>
<style>
body{
  font-family:system-ui;
  background:#f4f6fb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:white;
  padding:32px;
  width:360px;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  background:#0f172a;
  color:white;
  border:none;
}
.toggle{
  margin-top:14px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="card">
  <h2 id="title">Login SnapQR</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="submit()">Ingresar</button>
  <div class="toggle" onclick="toggle()">Crear cuenta</div>
  <p id="msg"></p>
</div>

<script>
const API = "https://snapqr-api.enzovillarroelv.workers.dev";
let mode = "login";

function toggle(){
  mode = mode==="login"?"register":"login";
  document.getElementById("title").textContent =
    mode==="login"?"Login SnapQR":"Registro SnapQR";
}

async function submit(){
  const email = email.value;
  const password = password.value;

  const res = await fetch(`${API}/api/${mode}`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email, password })
  });

  const data = await res.json();
  if(!res.ok) return msg.textContent = data.error;

  if(mode==="login"){
    localStorage.setItem("snapqr_token", data.token);
    location.href="/dashboard.html";
  } else {
    msg.textContent="Usuario creado, inicia sesión";
    toggle();
  }
}
</script>
</body>
</html>
