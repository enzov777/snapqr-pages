<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SnapQR Dashboard</title>
<style>
body{
  font-family:system-ui;
  background:#f5f7fa;
  margin:0;
  padding:40px;
}
.container{
  max-width:900px;
  margin:auto;
}
.card{
  background:white;
  padding:24px;
  border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  margin-bottom:20px;
}
input,button{
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
}
.qr{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:12px 0;
}
</style>
</head>

<body>
<div class="container">
  <h1>📊 SnapQR Dashboard</h1>

  <div class="card">
    <input id="target" placeholder="https://destino.com">
    <button onclick="crearQR()">Crear QR</button>
  </div>

  <div class="card">
    <h3>Mis QRs</h3>
    <div id="list"></div>
  </div>
</div>

<script>
const API = "https://snapqr-api.enzovillarroelv.workers.dev";
const token = localStorage.getItem("snapqr_token");

if(!token){
  location.href="/login.html";
}

async function crearQR(){
  const target = document.getElementById("target").value;

  await fetch(`${API}/api/links`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":token
    },
    body:JSON.stringify({ target })
  });

  cargar();
}

async function cargar(){
  const res = await fetch(`${API}/api/my-links`,{
    headers:{ "Authorization":token }
  });

  const data = await res.json();
  const list = document.getElementById("list");
  list.innerHTML = "";

data.forEach(q=>{
  list.innerHTML += `
    <div class="qr">
      <div>
        <strong>${q.slug}</strong><br>
        <input 
          value="${q.target}" 
          onchange="editar('${q.slug}', this.value)"
          style="width:320px"
        >
      </div>
      <div>
        👁 ${q.scans}
      </div>
    </div>
  `;
});
}

cargar();
</script>
</body>
</html>
