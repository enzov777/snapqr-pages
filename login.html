<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SnapQR · Login</title>
<style>
body{
  font-family:system-ui;
  background:#f5f7fa;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:white;
  padding:32px;
  width:360px;
  border-radius:14px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}
button{
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
}
.toggle{
  margin-top:14px;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  color:#555;
}
</style>
</head>

<body>
<div class="card">
  <h2 id="title">Login SnapQR</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Contraseña">

  <button onclick="submit()">Ingresar</button>

  <div class="toggle" onclick="toggleMode()">
    ¿No tienes cuenta? Crear una
  </div>

  <p id="msg"></p>
</div>

<script>
const API = "https://snapqr-api.enzovillarroelv.workers.dev";
let mode = "login";

function toggleMode(){
  mode = mode === "login" ? "register" : "login";
  document.getElementById("title").textContent =
    mode === "login" ? "Login SnapQR" : "Registro SnapQR";
  document.querySelector("button").textContent =
    mode === "login" ? "Ingresar" : "Crear cuenta";
  document.querySelector(".toggle").textContent =
    mode === "login"
      ? "¿No tienes cuenta? Crear una"
      : "¿Ya tienes cuenta? Ingresar";
}

async function submit(){
  const email = email.value;
  const password = password.value;
  const msg = document.getElementById("msg");

  const res = await fetch(`${API}/api/${mode}`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email, password })
  });

  const data = await res.json();

  if(!res.ok){
    msg.textContent = "❌ " + data.error;
    return;
  }

  if(mode === "login"){
    localStorage.setItem("snapqr_token", data.token);
    location.href = "/dashboard.html";
  } else {
    msg.textContent = "✅ Usuario creado, ahora inicia sesión";
    toggleMode();
  }
}
</script>
</body>
</html>
