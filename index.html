<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>SnapQR — Generador Profesional</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root {
  --primary: #111827;
  --accent: #2563eb;
  --bg: #f9fafb;
  --card: #ffffff;
}

* { box-sizing: border-box; font-family: 'Inter', sans-serif; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--primary);
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: 700;
  font-size: 22px;
}

.main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-top: 40px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,.06);
}

label {
  font-size: 13px;
  font-weight: 600;
  display: block;
  margin-top: 16px;
}

input[type="text"], input[type="color"] {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  margin-top: 6px;
}

.palette {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.palette div {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px #e5e7eb;
}

.qr-box {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 360px;
}

#qr-wrapper {
  position: relative;
  padding: 20px;
  background: white;
  border-radius: 16px;
}

#logo-center {
  position: absolute;
  width: 70px;
  height: 70px;
  object-fit: contain;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  border-radius: 12px;
  padding: 6px;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.primary {
  background: var(--accent);
  color: white;
}

.secondary {
  background: #e5e7eb;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div class="logo">SnapQR</div>
  </div>

  <div class="main">

    <!-- CONTROLES -->
    <div class="card">
      <label>URL de destino</label>
      <input id="url" type="text" value="https://snapqr.app"/>

      <label>Logo (PNG / SVG)</label>
      <input type="file" id="logoInput" accept="image/*"/>

      <label>Color principal</label>
      <input type="color" id="colorPicker" value="#2563eb"/>

      <label>Paletas sugeridas</label>
      <div class="palette" id="palette"></div>

      <div class="actions">
        <button class="primary" onclick="downloadPNG()">Descargar PNG</button>
        <button class="secondary" onclick="downloadSVG()">Descargar SVG</button>
      </div>
    </div>

    <!-- QR -->
    <div class="card qr-box">
      <div id="qr-wrapper">
        <div id="qrcode"></div>
        <img id="logo-center"/>
      </div>
    </div>

  </div>
</div>

<script>
const qr = new QRCode(document.getElementById("qrcode"), {
  text: document.getElementById("url").value,
  width: 260,
  height: 260,
  colorDark: "#2563eb",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});

const urlInput = document.getElementById("url");
const colorPicker = document.getElementById("colorPicker");
const logoInput = document.getElementById("logoInput");
const logoImg = document.getElementById("logo-center");

function regenerate() {
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), {
    text: urlInput.value,
    width: 260,
    height: 260,
    colorDark: colorPicker.value,
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
}

urlInput.oninput = regenerate;
colorPicker.oninput = regenerate;

logoInput.onchange = e => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => logoImg.src = reader.result;
  reader.readAsDataURL(file);
  generatePalette();
};

function generatePalette() {
  const colors = ["#111827", "#2563eb", "#16a34a", "#dc2626", "#7c3aed"];
  const palette = document.getElementById("palette");
  palette.innerHTML = "";
  colors.forEach(c => {
    const d = document.createElement("div");
    d.style.background = c;
    d.onclick = () => {
      colorPicker.value = c;
      regenerate();
    };
    palette.appendChild(d);
  });
}

function downloadPNG() {
  html2canvas(document.getElementById("qr-wrapper")).then(canvas => {
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "snapqr.png";
    a.click();
  });
}

function downloadSVG() {
  alert("SVG dinámico se conecta en el siguiente paso (Worker)");
}

generatePalette();
</script>
</body>
</html>
