<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SnapQR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f5f7fa;
      margin: 0;
      padding: 40px;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: #fff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      background: #111;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background: #000;
    }

    .result {
      margin-top: 20px;
      word-break: break-all;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>SnapQR</h1>
    <p>Crea enlaces dinámicos para tus QR</p>

    <input id="target" placeholder="Destino (https://...)" />
    <button onclick="crearQR()">Generar QR</button>

    <div class="result" id="resultado"></div>
  </div>

  <script>
    async function crearQR() {
      const target = document.getElementById("target").value;
      const resultado = document.getElementById("resultado");

      if (!target) {
        resultado.textContent = "❌ Ingresa un destino";
        return;
      }

      resultado.textContent = "Creando...";

      try {
        const res = await fetch(
          "https://snapqr-api.enzovillarroelv.workers.dev/api/links",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target })
          }
        );

        const data = await res.json();

        resultado.innerHTML = `
          ✅ Enlace creado:<br>
          <a href="${data.shortUrl}" target="_blank">
            ${data.shortUrl}
          </a>
        `;
      } catch (e) {
        resultado.textContent = "❌ Error conectando con la API";
      }
    }
  </script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

</body>
</html>
