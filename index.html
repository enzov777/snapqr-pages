<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SnapQR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f5f7fa;
      margin: 0;
      padding: 40px;
    }

    .card {
      max-width: 520px;
      margin: auto;
      background: #fff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      background: #111;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background: #000;
    }

    .result {
      margin-top: 20px;
      word-break: break-all;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="card">
  <h1>SnapQR</h1>
  <p>QR dinámicos, editables y profesionales</p>

  <input id="target" placeholder="Destino (https://...)" />

  <label>Color principal</label>
  <input type="color" id="colorDark" value="#000000">

  <label>Color de fondo</label>
  <input type="color" id="colorLight" value="#ffffff">

  <label>Logo central</label>
  <input type="file" id="logoInput" accept="image/*">

  <button onclick="crearQR()">Generar QR</button>

  <div id="qr-preview" style="margin-top:20px; text-align:center;"></div>

  <button id="downloadBtn" style="display:none;" onclick="descargarQR()">Descargar PNG</button>

  <div class="result" id="resultado"></div>
</div>

  </div>

<script>
let qr;
let currentQR;

async function crearQR() {
  const target = document.getElementById("target").value;
  const dark = document.getElementById("colorDark").value;
  const light = document.getElementById("colorLight").value;
  const result = document.getElementById("resultado");
  const preview = document.getElementById("qr-preview");

  if (!target) {
    result.textContent = "❌ Ingresa un destino";
    return;
  }

  result.textContent = "Creando enlace...";

  const res = await fetch(
    "https://snapqr-api.enzovillarroelv.workers.dev/api/links",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target })
    }
  );

  const data = await res.json();

  preview.innerHTML = "";
  qr = new QRCode(preview, {
    text: data.shortUrl,
    width: 256,
    height: 256,
    colorDark: dark,
    colorLight: light,
    correctLevel: QRCode.CorrectLevel.H
  });

  currentQR = preview.querySelector("canvas");

  result.innerHTML = `
    ✅ QR creado<br>
    <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>
  `;

  document.getElementById("downloadBtn").style.display = "block";

  aplicarLogo();
}

function aplicarLogo() {
  const input = document.getElementById("logoInput");
  if (!input.files[0]) return;

  const canvas = currentQR;
  const ctx = canvas.getContext("2d");
  const img = new Image();

  img.onload = () => {
    const size = canvas.width * 0.25;
    const x = (canvas.width - size) / 2;
    const y = (canvas.height - size) / 2;
    ctx.drawImage(img, x, y, size, size);
  };

  img.src = URL.createObjectURL(input.files[0]);
}

document.getElementById("logoInput").addEventListener("change", aplicarLogo);

function descargarQR() {
  const link = document.createElement("a");
  link.download = "snapqr.png";
  link.href = currentQR.toDataURL("image/png");
  link.click();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

</body>
</html>
